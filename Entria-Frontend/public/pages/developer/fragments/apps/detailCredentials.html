<div class="rounded-2xl border border-gray-300 bg-white shadow-sm">

  <div class="border-b border-gray-300 px-6 py-5">
    <h2 class="text-lg font-semibold text-gray-900">
      Dane aplikacji
    </h2>
  </div>

  <div class="space-y-6 p-6">

    <div class="grid grid-cols-1 gap-4 xl:grid-cols-[1fr_1fr]">

        <div class="flex min-w-0 gap-3">

            <div class="flex-1 rounded-xl bg-[#E6E1E8] px-4 py-3">

                <p class="text-xs uppercase tracking-wide text-gray-500">
                    Client ID
                </p>

                <p
                    id="application-client-id"
                    class="mt-1 break-all text-sm text-gray-900"
                ></p>

            </div>

            <button
                id="copy-client-id"
                class="flex h-[54px] w-[54px] shrink-0 items-center justify-center rounded-xl border border-gray-300 bg-white transition hover:bg-gray-50"
                >
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19.1667 0H5.83333C5.61232 0 5.40036 0.0877975 5.24408 0.244078C5.0878 0.400358 5 0.61232 5 0.833333V5H0.833333C0.61232 5 0.400358 5.0878 0.244078 5.24408C0.0877975 5.40036 0 5.61232 0 5.83333V19.1667C0 19.3877 0.0877975 19.5996 0.244078 19.7559C0.400358 19.9122 0.61232 20 0.833333 20H14.1667C14.3877 20 14.5996 19.9122 14.7559 19.7559C14.9122 19.5996 15 19.3877 15 19.1667V15H19.1667C19.3877 15 19.5996 14.9122 19.7559 14.7559C19.9122 14.5996 20 14.3877 20 14.1667V0.833333C20 0.61232 19.9122 0.400358 19.7559 0.244078C19.5996 0.0877975 19.3877 0 19.1667 0ZM13.3333 18.3333H1.66667V6.66667H13.3333V18.3333ZM18.3333 13.3333H15V5.83333C15 5.61232 14.9122 5.40036 14.7559 5.24408C14.5996 5.0878 14.3877 5 14.1667 5H6.66667V1.66667H18.3333V13.3333Z" fill="#161619"/>
                </svg>

            </button>

        </div>

        <div class="flex min-w-0 gap-3">
            <div class="min-w-0 flex-1 rounded-xl bg-[#E6E1E8] px-4 py-3">

                <p class="text-xs uppercase tracking-wide text-gray-500">
                    Client Secret
                </p>

                <p
                    id="application-client-secret"
                    class="mt-1 break-all text-sm text-gray-900"
                >
                    ••••••••••••••••
                </p>

            </div>

            <button
                id="toggle-client-secret"
                class="flex h-[54px] w-[54px] shrink-0 items-center justify-center rounded-xl border border-gray-300 bg-white transition hover:bg-gray-50" >
                <svg class="h-5 w-5" viewBox="0 0 23 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.4353 7.19625C22.4025 7.12219 21.6084 5.36062 19.8431 3.59531C17.4909 1.24312 14.52 0 11.25 0C7.97999 0 5.00905 1.24312 2.65687 3.59531C0.891554 5.36062 0.093741 7.125 0.0646785 7.19625C0.0220346 7.29217 0 7.39597 0 7.50094C0 7.60591 0.0220346 7.70971 0.0646785 7.80562C0.097491 7.87969 0.891554 9.64031 2.65687 11.4056C5.00905 13.7569 7.97999 15 11.25 15C14.52 15 17.4909 13.7569 19.8431 11.4056C21.6084 9.64031 22.4025 7.87969 22.4353 7.80562C22.4779 7.70971 22.5 7.60591 22.5 7.50094C22.5 7.39597 22.4779 7.29217 22.4353 7.19625ZM11.25 13.5C8.36437 13.5 5.84343 12.4509 3.75655 10.3828C2.90028 9.53128 2.17179 8.56027 1.59374 7.5C2.17164 6.43963 2.90014 5.4686 3.75655 4.61719C5.84343 2.54906 8.36437 1.5 11.25 1.5C14.1356 1.5 16.6566 2.54906 18.7434 4.61719C19.6014 5.4684 20.3315 6.43942 20.9109 7.5C20.235 8.76188 17.2903 13.5 11.25 13.5ZM11.25 3C10.36 3 9.48995 3.26392 8.74993 3.75839C8.0099 4.25285 7.43313 4.95566 7.09253 5.77792C6.75194 6.60019 6.66282 7.50499 6.83646 8.37791C7.01009 9.25082 7.43867 10.0526 8.06801 10.682C8.69735 11.3113 9.49917 11.7399 10.3721 11.9135C11.245 12.0872 12.1498 11.9981 12.9721 11.6575C13.7943 11.3169 14.4971 10.7401 14.9916 10.0001C15.4861 9.26005 15.75 8.39002 15.75 7.5C15.7488 6.30691 15.2742 5.16303 14.4306 4.31939C13.587 3.47575 12.4431 3.00124 11.25 3ZM11.25 10.5C10.6566 10.5 10.0766 10.3241 9.58328 9.99441C9.08993 9.66476 8.70542 9.19623 8.47835 8.64805C8.25129 8.09987 8.19188 7.49667 8.30764 6.91473C8.42339 6.33279 8.70911 5.79824 9.12867 5.37868C9.54823 4.95912 10.0828 4.6734 10.6647 4.55764C11.2467 4.44189 11.8499 4.5013 12.398 4.72836C12.9462 4.95542 13.4148 5.33994 13.7444 5.83329C14.074 6.32664 14.25 6.90666 14.25 7.5C14.25 8.29565 13.9339 9.05871 13.3713 9.62132C12.8087 10.1839 12.0456 10.5 11.25 10.5Z" fill="#161619"/>
                </svg>
            </button>

            <button
                id="refresh-client-secret"
                class="flex h-[54px] w-[54px] shrink-0 items-center justify-center rounded-xl border border-gray-300 bg-white transition hover:bg-gray-50">

            </button>
        </div>
    </div>

    <div class="rounded-xl bg-[#E6E1E8] px-4 py-3">

      <p class="text-xs uppercase tracking-wide text-gray-500">
        Redirect URI
      </p>

      <p
        id="application-redirect-uri"
        class="mt-1 break-all text-sm text-gray-900"
      ></p>

    </div>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">

      <div>

        <p class="text-xs uppercase tracking-wide text-gray-500">
          Domena
        </p>

        <p
          id="application-domain"
          class="mt-2 text-sm text-gray-900"
        ></p>

      </div>

      <div>

        <p class="text-xs uppercase tracking-wide text-gray-500">
          Opis
        </p>

        <p
          id="application-description"
          class="mt-2 text-sm text-gray-900"
        ></p>

      </div>

      <div>

        <p class="text-xs uppercase tracking-wide text-gray-500">
          Data utworzenia
        </p>

        <p
          id="application-created-at"
          class="mt-2 text-sm text-gray-900"
        ></p>

      </div>

      <div>

        <p class="text-xs uppercase tracking-wide text-gray-500">
          Ostatnia modyfikacja
        </p>

        <p
          id="application-last-update"
          class="mt-2 text-sm text-gray-900"
        ></p>

      </div>

    </div>

  </div>

</div>
