<div class="rounded-2xl border border-gray-300 bg-white shadow-sm">

  <div class="border-b border-gray-300 px-6 py-5">
    <h2 class="text-lg font-semibold text-gray-900">
      Dane aplikacji

                <p class="text-xs uppercase tracking-wide text-gray-500">
                    Client ID

                <p
                    id="application-client-id"
                    class="mt-1 break-all text-sm text-gray-900"
                ></p>

            </div>

            <button
                id="copy-client-id"
                class="flex h-[54px] w-[54px] text-gray-900 shrink-0 items-center justify-center rounded-xl border border-gray-300 bg-white transition hover:bg-gray-50"

                </svg>

            </button>

        </div>

        <div class="flex min-w-0 gap-3">
            <div class="min-w-0 flex-1 rounded-xl bg-[#E6E1E8] px-4 py-3">

                <p class="text-xs uppercase tracking-wide text-gray-500">
                    Client Secret
                </p>

                <p
                    id="application-client-secret"
                    class="mt-1 break-all text-sm text-gray-900"
                >
                    ••••••••••••••••
                </p>

            </div>

            <button
                id="toggle-client-secret"
                class="flex h-[54px] w-[54px] text-gray-900 shrink-0 items-center justify-center rounded-xl border border-gray-300 bg-white transition hover:bg-gray-50" >

                </svg>

            </button>

                </svg>
            </button>
        </div>
    </div>

    <div class="rounded-xl bg-[#E6E1E8] px-4 py-3">

      <p class="text-xs uppercase tracking-wide text-gray-500">
        Redirect URI
      </p>

      <p
        id="application-redirect-uri"
        class="mt-1 break-all text-sm text-gray-900"
      ></p>

    </div>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">

      <div>

        <p class="text-xs uppercase tracking-wide text-gray-500">
          Domena
        </p>

        <p
          id="application-domain"
          class="mt-2 text-sm text-gray-900"
        ></p>

      </div>

      <div>

        <p class="text-xs uppercase tracking-wide text-gray-500">
          Opis
        </p>

        <p
          id="application-description"
          class="mt-2 text-sm text-gray-900"
        ></p>

      </div>

      <div>

        <p class="text-xs uppercase tracking-wide text-gray-500">
          Data utworzenia
        </p>

        <p
          id="application-created-at"
          class="mt-2 text-sm text-gray-900"
        ></p>

      </div>

      <div>

        <p class="text-xs uppercase tracking-wide text-gray-500">
          Ostatnia modyfikacja
        </p>

        <p
          id="application-last-update"
          class="mt-2 text-sm text-gray-900"
        ></p>

      </div>

    </div>

  </div>

</div>
