<div class="rounded-xl border border-gray-300 bg-white shadow-sm">

  <div class="border-b border-gray-300 px-5 py-4">
    <h2 class="text-gray-900 text-base font-semibold">
      Dane aplikacji
    </h2>
  </div>

  <div class="space-y-4 p-5">

    <input
      id="application-name"
      type="text"
      placeholder="Nazwa aplikacji"
      class="h-[44px] w-full rounded-lg border border-gray-300 px-3 text-gray-900"
    />

    <input
      id="application-domain"
      type="text"
      placeholder="Domena"
      class="h-[44px] w-full rounded-lg border border-gray-300 px-3 text-gray-900"
    />

    <textarea
      id="application-description"
      placeholder="Opis aplikacji"
      class="h-[180px] w-full resize-none rounded-lg border border-gray-300 px-3 py-2 text-gray-900"
    ></textarea>

  </div>

</div>
