<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6">

  <div class="min-w-0 rounded-2xl border border-gray-300 bg-white p-6 shadow-sm">

    <p class="text-sm uppercase tracking-wide text-gray-500">
      Aplikacje
    </p>

    <p
      id="apps-count"
      class="mt-3 text-3xl 2xl:text-5xl font-semibold leading-none text-gray-900"
    ></p>

    <p
      id="apps-status"
      class="mt-3 text-sm leading-relaxed text-gray-500 break-words"
    ></p>

  </div>

  <div class="min-w-0 rounded-2xl border border-gray-300 bg-white p-6 shadow-sm">

    <p class="text-sm uppercase tracking-wide text-gray-500">
      Logowania
    </p>

    <p
      id="logins-count"
      class="mt-3 text-3xl 2xl:text-5xl font-semibold leading-none text-gray-900"
    ></p>

    <p
      id="logins-period"
      class="mt-3 text-sm leading-relaxed text-gray-500 break-words"
    ></p>

  </div>

  <div class="min-w-0 rounded-2xl border border-gray-300 bg-white p-6 shadow-sm">

    <p class="text-sm uppercase tracking-wide text-gray-500">
      Aktywni Użytkownicy
    </p>

    <p
      id="users-count"
      class="mt-3 text-3xl 2xl:text-5xl font-semibold leading-none text-gray-900"
    ></p>

    <p
      id="users-growth"
      class="mt-3 text-sm leading-relaxed text-gray-500 break-words"
    ></p>

  </div>

  <div class="min-w-0 rounded-2xl border border-gray-300 bg-white p-6 shadow-sm">

    <p class="text-sm uppercase tracking-wide text-gray-500">
      Błędy API
    </p>

    <p
      id="errors-count"
      class="mt-3 text-3xl 2xl:text-5xl font-semibold leading-none text-red-600"
    ></p>

    <p
      id="errors-critical"
      class="mt-3 text-sm leading-relaxed text-gray-500 break-words"
    ></p>

  </div>

</div>
