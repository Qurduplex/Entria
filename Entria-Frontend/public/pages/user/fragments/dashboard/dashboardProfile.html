<div class="card px-6 py-5 flex flex-col sm:flex-row sm:items-center gap-4">
  <div
    id="profile-avatar"
    class="h-12 w-12 rounded-full flex items-center justify-center text-base font-semibold text-white shrink-0 overflow-hidden"
    style="background: #7C5CFC;"
  ></div>

  <div class="flex-1 min-w-0">
    <p id="profile-name" class="text-base font-semibold text-[#161619] leading-tight"></p>
    <p id="profile-email" class="text-sm text-[#8D8D8D] mt-0.5"></p>

    <div class="mt-3 flex items-center gap-3">
      <div class="flex-1 h-1.5 rounded-full bg-[#F0EEF8] overflow-hidden">
        <div
          id="profile-progress-bar"
          class="h-full rounded-full bg-[#7C5CFC] transition-all duration-500"
          style="width: 0%"
        ></div>
      </div>
      <p id="profile-progress-label" class="text-xs text-[#8D8D8D] shrink-0"></p>
    </div>
  </div>

  <button id="profile-action-btn" class="shrink-0 rounded-full bg-[#161619] px-4 py-2 text-sm text-white hover:bg-[#2a2a30] transition-colors cursor-pointer">
    Uzupełnij profil
  </button>
</div>
