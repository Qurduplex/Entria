<section class="space-y-6">

  <div id="consents-list" class="flex flex-col gap-5"></div>

  <div id="logout-all-container"></div>

</section>

<!-- ─── TEMPLATE: karta zgody/aplikacji ─────────────────────────────────── -->
<template id="tpl-consent-card">
  <div class="card" data-consent-card>
    <div class="card-header justify-between">
      <div class="flex items-center gap-3 min-w-0">
        <div
          data-app-avatar
          class="w-10 h-10 rounded-xl flex items-center justify-center text-white text-[13px] font-semibold shrink-0 overflow-hidden"
          style="background-color:#7C6FFF;"
        ></div>
        <div class="min-w-0">
          <p data-app-name class="text-[15px] font-semibold text-[#161619] truncate"></p>
          <p data-app-redirect class="text-[12px] text-[#8D8D8D] truncate"></p>
        </div>
      </div>

      <button
        data-consent-toggle
        class="shrink-0 bg-[#161619] text-white text-[13px] font-medium px-4 py-2 rounded-xl hover:bg-[#2a2a2e] transition-colors cursor-pointer"
      >
        Szczegóły
      </button>
    </div>

    <div data-consent-detail class="hidden border-t border-gray-100 px-5 py-1">
      <p class="text-[11px] uppercase tracking-wide text-[#8D8D8D] mt-3 mb-1">Udostępnione dane</p>

      <div data-scopes-list></div>

      <p data-scopes-empty class="hidden text-[13px] text-[#8D8D8D] py-3">
        Brak szczegółowych uprawnień.
      </p>

      <div class="flex justify-end py-4 border-t border-gray-100 mt-1">
        <button
          data-consent-revoke
          class="bg-[#161619] text-white text-[13px] font-medium px-5 py-2.5 rounded-xl hover:bg-red-600 transition-colors cursor-pointer"
        >
          Cofnij dostęp
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ─── TEMPLATE: wiersz pojedynczego scope ─────────────────────────────── -->
<template id="tpl-scope-row">
  <div class="flex items-center justify-between gap-4 py-3 border-b border-gray-100 last:border-0">
    <span class="flex items-center gap-3 text-[14px] text-[#161619]">
      <span class="text-green-600">✓</span>
      <span data-scope-name></span>
    </span>
    <span
      data-scope-sensitive
      class="hidden text-[11px] font-medium text-red-500 bg-red-50 px-2 py-0.5 rounded-full"
    >
      Wrażliwe
    </span>
  </div>
</template>

<!-- ─── TEMPLATE: pusta lista zgód ──────────────────────────────────────── -->
<template id="tpl-consents-empty">
  <div class="card">
    <div class="px-5 py-8 text-center">
      <p class="text-[14px] font-medium text-[#161619] mb-1">Brak połączonych aplikacji</p>
      <p class="text-[13px] text-[#8D8D8D]">
        Aplikacje, którym udzielisz dostępu przez Entria, pojawią się tutaj.
      </p>
    </div>
  </div>
</template>

<!-- ─── TEMPLATE: karta "Wyloguj ze wszystkich urządzeń" ────────────────── -->

        data-logout-all

      >

      </button>

<!-- ─── TEMPLATE: popup "Cofnij dostęp" ─────────────────────────────────── -->
<template id="tpl-revoke-popup">
  <div class="fixed inset-0 z-[9999] bg-black/40 backdrop-blur-sm flex items-center justify-center" data-overlay>
    <div class="bg-white rounded-2xl p-7 max-w-[320px] w-[calc(100%-32px)] shadow-[0_8px_40px_rgba(0,0,0,0.14)]" data-dialog>
      <div class="flex items-center gap-3 mb-4">
        <div class="w-9 h-9 rounded-full bg-red-100 flex items-center justify-center shrink-0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
          </svg>
        </div>
        <p class="text-[15px] font-semibold text-[#161619]">
          Cofnąć dostęp dla <span data-app-name></span>?
        </p>
      </div>
      <p class="text-[13.5px] text-[#444] leading-relaxed mb-2">
        Aplikacja straci dostęp do udostępnionych danych. Przy następnym logowaniu przez Entria poprosi Cię o zgodę ponownie.
      </p>
      <div class="bg-[#F5F4F9] rounded-xl px-4 py-3 mb-6 border-l-4 border-[#A89DFF]">
        <p class="text-[13px] text-[#666] leading-relaxed">
          Twoje konto w samym serwisie pozostaje bez zmian – cofnięcie dotyczy tylko zgody w Entria.
        </p>
      </div>
      <div class="flex justify-end gap-2.5">
        <button data-cancel class="btn-secondary">Anuluj</button>
        <button
          data-confirm
          class="px-[18px] py-[9px] rounded-[10px] bg-red-500 text-white text-[13px] font-medium hover:bg-red-600 transition-colors cursor-pointer"
        >
          Cofnij dostęp
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ─── TEMPLATE: popup "Wyloguj ze wszystkich urządzeń" ────────────────── -->
<template id="tpl-logout-all-popup">
  <div class="fixed inset-0 z-[9999] bg-black/40 backdrop-blur-sm flex items-center justify-center" data-overlay>
    <div class="bg-white rounded-2xl p-6 max-w-[320px] w-[calc(100%-32px)] shadow-[0_8px_40px_rgba(0,0,0,0.14)]" data-dialog>
      <h2 class="text-[16px] font-semibold text-[#161619] mb-1.5">Wylogować ze wszystkich urządzeń?</h2>
      <p class="text-[13px] text-[#8D8D8D] leading-relaxed mb-5">
        Wszystkie aktywne sesje zostaną natychmiast zakończone. Na tym urządzeniu również zostaniesz wylogowany.
      </p>
      <div class="flex justify-end gap-2.5">
        <button data-cancel class="px-[18px] py-[9px] rounded-[10px] border border-[#E0E0E0] bg-white text-[13px] font-medium text-[#444] hover:bg-[#F5F5F5] transition-colors cursor-pointer">Anuluj</button>
        <button data-confirm class="px-[18px] py-[9px] rounded-[10px] bg-red-500 text-white text-[13px] font-medium hover:bg-red-600 transition-colors cursor-pointer">Tak, wyloguj wszędzie</button>
      </div>
    </div>
  </div>
</template>
