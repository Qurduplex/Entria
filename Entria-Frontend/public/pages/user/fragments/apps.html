<div class="flex flex-col gap-5">

  <!-- APLIKACJE -->
  <div class="card">
    <div class="card-header justify-between">
      <div class="flex items-center gap-3">
        <div class="card-icon">
          <svg width="18" height="18" viewBox="0 0 24 24"></svg>
        </div>
        <div>
          <p class="card-title">Aplikacje</p>
          <p class="card-subtitle">Serwisy do których logujesz się przez Entria</p>
        </div>
      </div>
      <span id="apps-count-badge" class="text-[12px] font-medium text-[#7C5CFC] bg-[#EEF0FF] px-3 py-1 rounded-full"></span>
    </div>
    <div id="apps-list" class="divide-y divide-gray-100"></div>
  </div>

  <!-- URZĄDZENIA -->
  <div class="card">
    <div class="card-header justify-between">
      <div class="flex items-center gap-3">
        <div class="card-icon">
          <svg width="18" height="18" viewBox="0 0 24 24"></svg>
        </div>
        <div>
          <p class="card-title">Urządzenia</p>
          <p class="card-subtitle">Historia urządzeń – wyloguj aktywną sesję zdalnie</p>
        </div>
      </div>
      <span id="devices-count-badge" class="text-[12px] font-medium text-[#7C5CFC] bg-[#EEF0FF] px-3 py-1 rounded-full"></span>
    </div>
    <div id="devices-list" class="divide-y divide-gray-100"></div>
    <div class="px-5 py-3 border-t border-gray-100">
      <p id="devices-summary" class="text-[12px] text-[#8D8D8D]"></p>
    </div>
  </div>

</div>
