syntax = "proto3";

package edu.pk.qurduplex.common.grpc;

option java_multiple_files = true;
option java_package = "edu.pk.qurduplex.common.grpc";

service UserProfileGrpcService {
  rpc GetUserProfile (UserProfileRequest) returns (UserProfileResponse);
}

message UserProfileRequest {
  string userId = 1;
}

message UserProfileResponse {
  string firstName = 1;
  string lastName = 2;
  string phoneNumber = 3;
  string pesel = 4;
  string sex = 5;
  string birthDate = 6;
  string profilePictureUrl = 7;
}