server:
  port: ${SERVER_PORT:12003}

spring:
  application:
    name: app-registry-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_registry_db}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

application:
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    external-url: ${MINIO_EXTERNAL_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:password}
    public-bucket: ${MINIO_PUBLIC_BUCKET:entria-public-files}
  oauth2:
    authorize-url: ${FRONTEND_AUTHORIZE_URL:http://localhost:3000/authorize}

grpc:
  server:
    port: 9091