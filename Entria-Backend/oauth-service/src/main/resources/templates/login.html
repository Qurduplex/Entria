<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logowanie · Entria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:ital,wght@0,500;0,600;1,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d0d0d;
        --surface: #161616;
        --surface-2: #1d1d1d;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.16);
        --text: #f2f2f2;
        --text-muted: #8a8a8a;
        --accent: #7f77dd;
        --accent-hover: #918ae6;
        --accent-soft: rgba(127, 119, 221, 0.14);
        --danger-bg: rgba(226, 75, 74, 0.1);
        --danger-border: rgba(226, 75, 74, 0.35);
        --danger-text: #f08a89;
        --info-bg: rgba(127, 119, 221, 0.1);
        --info-border: rgba(127, 119, 221, 0.3);
        --info-text: #b3aef0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", system-ui, sans-serif;
        background: var(--bg);
        background-image: radial-gradient(
          circle at 50% 0%,
          rgba(127, 119, 221, 0.08),
          transparent 55%
        );
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        max-width: 400px;
        width: 100%;
        padding: 44px 40px 40px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }

      .brand {
        text-align: center;
        margin-bottom: 32px;
      }

      .brand-logo-img {
        height: 38px;
        width: auto;
        display: inline-block;
      }

      .brand-sub {
        margin-top: 10px;
        font-size: 13px;
        color: var(--text-muted);
        letter-spacing: 0.2px;
      }

      .alert {
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 22px;
        font-size: 13.5px;
        line-height: 1.45;
      }

      .alert-error {
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        color: var(--danger-text);
        display: none;
      }
      .alert-error.show {
        display: block;
      }

      .alert-info {
        background: var(--info-bg);
        border: 1px solid var(--info-border);
        color: var(--info-text);
        display: none;
      }
      .alert-info.show {
        display: block;
      }

      .field {
        margin-bottom: 18px;
      }
      .field:last-of-type {
        margin-bottom: 26px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 8px;
        letter-spacing: 0.2px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 13px 15px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
        color: var(--text);
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      input::placeholder {
        color: #5c5c5c;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .btn {
        width: 100%;
        padding: 14px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        position: relative;
        transition:
          background 0.2s ease,
          transform 0.1s ease;
      }
      .btn:hover {
        background: var(--accent-hover);
      }
      .btn:active {
        transform: translateY(1px);
      }

      .btn .spinner {
        display: none;
        position: absolute;
        left: 18px;
        top: 50%;
        width: 16px;
        height: 16px;
        margin-top: -8px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      .btn.loading {
        color: transparent;
      }
      .btn.loading .spinner {
        display: block;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img src="../static/images/Entria.png" alt="Entria" class="brand-logo-img" />
        <div class="brand-sub">Zaloguj się, aby kontynuować</div>
      </div>

      <div
        id="errorMessage"
        class="alert alert-error"
        th:classappend="${param.error} ? 'show' : ''"
      >
        <span
          th:if="${param.error}"
          th:text="${session['SPRING_SECURITY_LAST_EXCEPTION']?.message ?: 'Nieprawidłowy adres e-mail lub hasło.'}"
        ></span>
      </div>
      <div id="infoMessage" class="alert alert-info"></div>

      <form id="loginForm" method="post" th:action="@{/login}">
        <div class="field">
          <label for="username">Email</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="twój@email.pl"
            required
            autocomplete="username"
          />
        </div>

        <div class="field">
          <label for="password">Hasło</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Wprowadź hasło"
            required
            autocomplete="current-password"
          />
        </div>

        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        />

        <button type="submit" class="btn">
          <span class="spinner"></span>
          Zaloguj się
        </button>
      </form>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const errorMessage = document.getElementById("errorMessage");
      const infoMessage = document.getElementById("infoMessage");
      const loginButton = form.querySelector('button[type="submit"]');
      const urlParams = new URLSearchParams(window.location.search);

      if (urlParams.has("logout")) {
        infoMessage.textContent = "You have been successfully logged out.";
        infoMessage.classList.add("show");
      }

      form.addEventListener("submit", function (e) {
        loginButton.classList.add("loading");
      });

      document
        .getElementById("username")
        .addEventListener("focus", function () {
          errorMessage.classList.remove("show");
        });

      document
        .getElementById("password")
        .addEventListener("focus", function () {
          errorMessage.classList.remove("show");
        });
    </script>
  </body>
</html>
