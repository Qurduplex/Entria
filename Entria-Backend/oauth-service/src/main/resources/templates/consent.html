<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consent Confirmation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .consent-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .app-info {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .app-icon {
            font-size: 48px;
            margin-right: 15px;
        }

        .app-details h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .app-details p {
            color: #666;
            font-size: 14px;
        }

        .principal-info {
            color: #999;
            font-size: 13px;
            margin-top: 8px;
        }

        .info {
            padding: 15px;
            background-color: #e3f2fd;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #2196F3;
            font-size: 14px;
            color: #1565c0;
        }

        h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .scopes-list {
            list-style: none;
            margin-bottom: 30px;
        }

        .scope-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .scope-item:hover {
            background: #f5f5f5;
            border-color: #667eea;
        }

        .scope-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .scope-item input[type="checkbox"]:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .scope-label {
            flex: 1;
            font-size: 14px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mandatory-badge {
            color: #e74c3c;
            font-weight: bold;
            font-size: 16px;
            padding: 0 4px;
        }

        .mandatory-label {
            color: #e74c3c;
            font-weight: bold;
        }

        .optional-label {
            color: #2196F3;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button[value="approve"] {
            background: #667eea;
            color: white;
            flex: 1;
            min-width: 140px;
        }

        button[value="approve"]:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button[value="cancel"] {
            background: #e0e0e0;
            color: #333;
        }

        button[value="cancel"]:hover {
            background: #d0d0d0;
            transform: translateY(-2px);
        }

        .mandatory-legend {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="consent-container">
    <div class="app-info">
        <div class="app-icon">🔐</div>
        <div class="app-details">
            <h1>Consent Confirmation</h1>
            <p>This application is requesting access to your account</p>
            <div class="principal-info">
                Signed in as: <strong th:text="${principalName}"></strong>
            </div>
        </div>
    </div>

    <div class="info">
        <strong>ℹ️ Permissions marked with <span class="mandatory-badge">*</span> are required to use this application.</strong>
    </div>

    <h3>Requested Permissions</h3>

    <form method="post" action="/oauth2/consent">
        <input type="hidden" name="client_id" th:value="${clientId}">
        <input type="hidden" name="state" th:value="${state}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <ul class="scopes-list">
            <li th:each="scope : ${scopes.entrySet()}" class="scope-item">
                <th:block th:if="${scope.getValue()}">
                    <input type="checkbox"
                           name="scope"
                           th:value="${scope.getKey()}"
                           checked="checked"
                           disabled="disabled" />
                    <input type="hidden" name="scope" th:value="${scope.getKey()}" />
                    <span class="scope-label">
                        <span class="mandatory-label" th:text="${scope.getKey()}"></span>
                        <span class="mandatory-badge">*</span>
                    </span>
                </th:block>

                <th:block th:unless="${scope.getValue()}">
                    <input type="checkbox" name="scope" th:value="${scope.getKey()}" />
                    <span class="scope-label optional-label" th:text="${scope.getKey()}"></span>
                </th:block>
            </li>
        </ul>

        <div class="action-buttons">
            <button type="submit" name="consent_action" value="cancel">Deny</button>
            <button type="submit" name="consent_action" value="approve">Allow</button>
        </div>

        <div class="mandatory-legend">
            <div><span class="mandatory-badge">*</span> - Required permission</div>
            <div>No symbol - Optional permission</div>
        </div>
    </form>
</div>
</body>
</html>
