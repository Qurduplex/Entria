<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zgoda na dostęp · Entria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:ital,wght@0,500;0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #161616;
            --surface-2: #1d1d1d;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f2f2f2;
            --text-muted: #8a8a8a;
            --text-dim: #5c5c5c;
            --accent: #7f77dd;
            --accent-hover: #918ae6;
            --accent-soft: rgba(127, 119, 221, 0.14);
            --track: #2a2a2a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(127, 119, 221, 0.08), transparent 55%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 460px;
            width: 100%;
            padding: 40px 38px 32px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 26px;
        }
        .brand .e { font-style: italic; color: var(--accent); }

        .brand-logo-img {
    height: 38px;
    width: auto;
    display: inline-block;
}

        .lead {
            text-align: center;
            margin-bottom: 28px;
        }
        .lead h1 {
            font-family: 'Playfair Display', serif;
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .lead p {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .principal {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .principal strong { color: var(--text); font-weight: 600; }

        .section-label {
            font-size: 11px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 14px;
        }

        .scopes { list-style: none; margin-bottom: 26px; }

        .scope {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 14px 16px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .scope-text { display: flex; flex-direction: column; gap: 3px; }
        .scope-name { font-size: 14px; font-weight: 500; color: var(--text); }
        .scope-tag { font-size: 11.5px; }
        .scope-tag.required { color: var(--accent); }
        .scope-tag.optional { color: var(--text-dim); }

        /* Toggle przełącznik — ukryty checkbox + wizualny track/knob.
           name/value/disabled pozostają nietknięte dla backendu. */
        .toggle { position: relative; flex-shrink: 0; width: 44px; height: 26px; }
        .toggle input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            cursor: pointer;
            z-index: 2;
        }
        .toggle .track {
            position: absolute;
            inset: 0;
            background: var(--track);
            border-radius: 999px;
            transition: background 0.2s ease;
        }
        .toggle .track::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: #cfcfcf;
            border-radius: 50%;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .toggle input:checked + .track { background: var(--accent); }
        .toggle input:checked + .track::after { transform: translateX(18px); background: #fff; }
        .toggle input:focus-visible + .track { box-shadow: 0 0 0 3px var(--accent-soft); }
        .toggle input:disabled { cursor: not-allowed; }
        .toggle input:disabled + .track { opacity: 0.85; }

        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        button.btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        button.btn:active { transform: translateY(1px); }

        .btn-approve { background: var(--accent); color: #fff; }
        .btn-approve:hover { background: var(--accent-hover); }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border) !important;
        }
        .btn-cancel:hover { background: var(--surface-2); color: var(--text); }

        .legend {
            font-size: 12px;
            color: var(--text-dim);
            text-align: center;
            line-height: 1.5;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .legend .accent { color: var(--accent); }

        /* Ekran auto-przekierowania */
        .redirect { text-align: center; padding: 24px 0; }
        .redirect .ring {
            width: 46px; height: 46px;
            margin: 0 auto 20px;
            border: 3px solid var(--track);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .redirect h2 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .redirect p { font-size: 13.5px; color: var(--text-muted); }

        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

<div th:if="${autoSubmit}" class="card">
    <div class="redirect">
        <div class="ring"></div>
        <h2>Przekierowywanie…</h2>
        <p>Stosujemy Twoje zapisane uprawnienia</p>
    </div>

    <form id="autoSubmitForm" method="post" th:action="@{/oauth2/consent}" style="display:none;">
        <input type="hidden" name="client_id" th:value="${clientId}">
        <input type="hidden" name="state" th:value="${state}">
        <input type="hidden" name="consent_action" value="approve">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <th:block th:each="scp : ${approvedScopes}">
            <input type="hidden" name="scope" th:value="${scp}">
        </th:block>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                document.getElementById('autoSubmitForm').submit();
            }, 300);
        });
    </script>
</div>


<div th:unless="${autoSubmit}" class="card">
    <div class="brand">
        <img th:if="${logoUrl != null and !logoUrl.isEmpty()}"
             th:src="${logoUrl}"
             th:alt="${appName}"
             class="brand-logo-img"
             style="border-radius: 8px; max-height: 48px; object-fit: contain;">

        <img th:unless="${logoUrl != null and !logoUrl.isEmpty()}"
             th:src="@{/images/Entria.png}"
             alt="Entria"
             class="brand-logo-img">
    </div>

    <div class="lead">
        <h1>Prośba o dostęp</h1>
        <p>Aplikacja <strong th:text="${appName != null and !appName.isEmpty() ? appName : 'zewnętrzna'}"></strong> prosi o dostęp do Twojego konta.</p>
        <div class="principal">Zalogowano jako <strong th:text="${principalName}"></strong></div>
    </div>

    <div th:if="${tosPdfUrl != null and !tosPdfUrl.isEmpty()}" style="text-align: center; margin-bottom: 24px;">
        <a th:href="${tosPdfUrl}" target="_blank" style="color: var(--accent); font-size: 13px; text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            Regulamin aplikacji
        </a>
    </div>

    <div class="section-label">Żądane uprawnienia</div>

    <form method="post" th:action="@{/oauth2/consent}">
        <input type="hidden" name="client_id" th:value="${clientId}">
        <input type="hidden" name="state" th:value="${state}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="scope" value="openid" th:if="${requestOpenid}">

        <ul class="scopes">
            <li th:each="scope : ${scopes.entrySet()}" class="scope">
                <th:block th:if="${scope.getValue()}">
                    <div class="scope-text">
                        <span class="scope-name" th:text="${scope.getKey()}"></span>
                        <span class="scope-tag required">Wymagane</span>
                    </div>
                    <label class="toggle">
                        <input type="checkbox"
                               name="scope"
                               th:value="${scope.getKey()}"
                               checked="checked"
                               disabled="disabled" />
                        <span class="track"></span>
                    </label>
                    <input type="hidden" name="scope" th:value="${scope.getKey()}" />
                </th:block>

                <!-- OPCJONALNE: toggle klikalny -->
                <th:block th:unless="${scope.getValue()}">
                    <div class="scope-text">
                        <span class="scope-name" th:text="${scope.getKey()}"></span>
                        <span class="scope-tag optional">Opcjonalne</span>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" name="scope" th:value="${scope.getKey()}" />
                        <span class="track"></span>
                    </label>
                </th:block>
            </li>
        </ul>

        <div class="actions">
            <button type="submit" class="btn btn-cancel" name="consent_action" value="cancel">Odmów</button>
            <button type="submit" class="btn btn-approve" name="consent_action" value="approve">Zezwól</button>
        </div>

        <div class="legend">
            Uprawnienia oznaczone jako <span class="accent">Wymagane</span> są niezbędne do działania aplikacji.
        </div>
    </form>
</div>

</body>
</html>
