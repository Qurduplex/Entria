server:
  port: ${SERVER_PORT:12005}

spring:
  application:
    name: oauth-service

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

grpc:
  client:
    identity-service:
      negotiation-type: plaintext
    app-registry-service:
      negotiation-type: plaintext